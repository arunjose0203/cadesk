name: CI

# The solution lives in cadesk/ while GitHub only reads workflows from the repository root,
# so every job runs from that folder.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gitleaks:
    name: Secret scanning (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cadesk
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Create database roles
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f deploy/db-init.sql
      - run: dotnet restore CaDesk.slnx
      - run: dotnet build CaDesk.slnx --no-restore -c Release
      # a fresh database every run: proves migrations 0001..latest apply cleanly and match the EF model (SchemaDriftTests)
      - name: Test (unit + integration + schema drift)
        run: dotnet test CaDesk.slnx --no-build -c Release --logger "console;verbosity=normal"

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cadesk/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cadesk/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
