apiVersion: apps/v1
kind: Deployment
metadata:
  name: cadesk-web
  namespace: cadesk-prod
  labels:
    app: cadesk-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cadesk-web
  template:
    metadata:
      labels:
        app: cadesk-web
    spec:
      containers:
        - name: web
          image: cadesk-web:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
            - containerPort: 443
              name: https
          env:
            - name: SITE_ADDRESS
              valueFrom:
                configMapKeyRef:
                  name: cadesk-config
                  key: SITE_ADDRESS
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: cadesk-web
  namespace: cadesk-prod
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 80
      name: http
    - port: 443
      targetPort: 443
      name: https
  selector:
    app: cadesk-web
