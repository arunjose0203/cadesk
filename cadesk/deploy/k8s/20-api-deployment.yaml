apiVersion: apps/v1
kind: Deployment
metadata:
  name: cadesk-api
  namespace: cadesk-prod
  labels:
    app: cadesk-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cadesk-api
  template:
    metadata:
      labels:
        app: cadesk-api
    spec:
      containers:
        - name: api
          image: cadesk-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: cadesk-config
            - secretRef:
                name: cadesk-secrets
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: dpkeys
              mountPath: /keys
            - name: documents
              mountPath: /documents
      volumes:
        - name: dpkeys
          persistentVolumeClaim:
            claimName: cadesk-dpkeys-pvc
        - name: documents
          persistentVolumeClaim:
            claimName: cadesk-documents-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: cadesk-api
  namespace: cadesk-prod
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      name: http
  selector:
    app: cadesk-api
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cadesk-dpkeys-pvc
  namespace: cadesk-prod
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cadesk-documents-pvc
  namespace: cadesk-prod
spec:
  accessModes: ["ReadWriteMany"]
  resources:
    requests:
      storage: 100Gi
