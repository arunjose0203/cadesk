apiVersion: v1
kind: Secret
metadata:
  name: cadesk-secrets
  namespace: cadesk-prod
type: Opaque
stringData:
  # Replace with real production secrets via sealed-secrets / external-secrets (never commit live values)
  ConnectionStrings__App: "Host=cadesk-postgres;Port=5432;Database=cadesk;Username=cadesk_app;Password=app_prod_secure_password"
  ConnectionStrings__Owner: "Host=cadesk-postgres;Port=5432;Database=cadesk;Username=cadesk_owner;Password=owner_prod_secure_password"
  OWNER_DB_PASSWORD: "owner_prod_secure_password"
  APP_DB_PASSWORD: "app_prod_secure_password"
  Jwt__SigningKey: "super-secure-production-jwt-signing-key-minimum-64-characters-long-entropy"
  BACKUP_ENCRYPTION_KEY: "strong-aes-256-backup-encryption-passphrase-production"
  POSTGRES_PASSWORD: "superuser_prod_secure_password"
  Notifications__WhatsApp__VerifyToken: "replace-with-random-whatsapp-verify-token"
  # Optional S3 Document Vault & Email credentials:
  # Documents__S3__AccessKey: ""
  # Documents__S3__SecretKey: ""
  # Notifications__Email__Password: ""
  # Notifications__Email__SendGridApiKey: ""
